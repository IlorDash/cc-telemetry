# Claude Code telemetry stack: OTLP -> OTel Collector -> ClickHouse -> Grafana
# Start:  docker compose up -d        (from this folder, after copying .env.example to .env)
# Grafana: http://localhost:3000  (admin / GRAFANA_ADMIN_PASSWORD; other PCs: see GRAFANA_BIND below)
# OTLP:    gRPC :4317, HTTP :4318  (both for other PCs: see OTLP_BIND below and the setup scripts)

services:
  clickhouse:
    # CLICKHOUSE_VERSION in .env overrides the tag (setup-server.sh sets 22.3.20.29 on ARM CPUs without LRCPC, e.g. Raspberry Pi 4).
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8}
    restart: unless-stopped
    # CLICKHOUSE_CPUS in .env: CPU cores of the container, 0 = no limit (default). setup-server.sh writes 2 together with
    # CLICKHOUSE_LIMITS=small for ClickHouse 22.3 (Raspberry Pi 4).
    cpus: ${CLICKHOUSE_CPUS:-0}
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Always on: small text log, no system logs, no query logging.
      - ./clickhouse/config.d/common.xml:/etc/clickhouse-server/config.d/cc-common.xml:ro
      - ./clickhouse/users.d/common.xml:/etc/clickhouse-server/users.d/cc-common.xml:ro
      # CLICKHOUSE_LIMITS in .env: small = memory, thread and merge limits of a small server, none = ClickHouse
      # defaults (default). Long syntax with create_host_path: false, so a mistyped value fails instead of
      # making Docker create a directory in place of the file.
      - type: bind
        source: ./clickhouse/limits/${CLICKHOUSE_LIMITS:-none}/config.xml
        target: /etc/clickhouse-server/config.d/cc-limits.xml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./clickhouse/limits/${CLICKHOUSE_LIMITS:-none}/users.xml
        target: /etc/clickhouse-server/users.d/cc-limits.xml
        read_only: true
        bind: { create_host_path: false }
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user otel --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 60s
      timeout: 5s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP gRPC 4317 (Claude Code clients) and OTLP HTTP 4318 (session-meta hook), same trust, no auth.
      # OTLP_BIND in .env: 127.0.0.1 = this PC only, 0.0.0.0 = LAN. Both ports follow it.
      # setup-server.sh sets it; unset keeps the Windows behaviour (the Windows firewall decides).
      - "${OTLP_BIND:-0.0.0.0}:4317:4317"
      - "${OTLP_BIND:-0.0.0.0}:4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy

  # One-shot: waits until the collector has created otel.otel_logs, sets the retention TTL of otel.* tables that
  # have none, then creates the cc.* tables, the materialized view and the views and backfills cc.events_t
  # (schema.sql, backfill.sql, views.sql).
  # Re-run after editing clickhouse/views.sql:  docker compose run --rm views-init
  views-init:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8}
    restart: "no"
    entrypoint: ["bash", "/init/init-views.sh"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Days of the retention TTL (RETENTION_DAYS in .env; setup-server.sh writes 180 for ClickHouse 22.3, else 365).
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
    volumes:
      - ./clickhouse:/init:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Rebuilds the derived tables cc.session_project_t and cc.tips_t (clickhouse/refresh.sql) every 5 minutes.
  # The only runner of refresh.sql; starts its first refresh as soon as views-init has finished.
  # A failed run is logged and repeated. Logs: docker compose logs cc-refresh
  cc-refresh:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8}
    restart: unless-stopped
    entrypoint: ["bash", "/init/refresh-loop.sh"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./clickhouse:/init:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      views-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1m
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # GRAFANA_BIND in .env: 127.0.0.1 = this PC only (default, Windows), 0.0.0.0 = LAN (setup-server.sh on Linux).
      # GRAFANA_PORT in .env: the host port (default 3000); the container port stays 3000.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  grafana-data:
