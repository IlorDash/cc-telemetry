# Claude Code telemetry stack: OTLP -> OTel Collector -> ClickHouse -> Grafana
# Start:  docker compose up -d        (from this folder, after copying .env.example to .env)
# Grafana: http://localhost:3000  (admin / GRAFANA_ADMIN_PASSWORD)
# OTLP:    gRPC :4317, HTTP :4318  (open 4317 in Windows Firewall for other PCs)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user otel --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (Claude Code clients)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy

  # One-shot: waits until the collector has created otel.otel_logs, then (re)creates the cc.* views.
  # Re-run after editing clickhouse/views.sql:  docker compose run --rm views-init
  views-init:
    image: clickhouse/clickhouse-server:25.8
    restart: "no"
    entrypoint: ["bash", "/init/init-views.sh"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./clickhouse:/init:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cc-usage.json
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  grafana-data:
