receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    timeout: 30s
    send_batch_size: 1000
  # Claude's reply text (assistant_response.response) comes with OTEL_LOG_USER_PROMPTS=1 together with the prompts.
  # The dashboard does not use it, so it is dropped here; response_length stays.
  attributes/drop_response:
    actions:
      - key: response
        action: delete

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    username: otel
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: 4320h
    logs_table_name: otel_logs
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 10000

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop_response, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
