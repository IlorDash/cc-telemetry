# Documentation. docs/ holds page.md + page.ru.md; MkDocs + mkdocs-static-i18n
# build both language trees into site_dir: site, which is what Pages serves.
name: docs

on:
  # No path filter: the docs build is cheap, and release-markers must run on
  # every pull request into main, whatever it touches.
  pull_request:
  # A push to main that changes only non-site files does not redeploy; run the
  # workflow by hand on main (workflow_dispatch) to cover that case.
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - docs/**
      - hooks/**
      - VERSION
      - ci/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --strict turns MkDocs warnings into errors. Pages has no per-PR preview, so
  # this job's artifact is the preview: download it from the run and open
  # site/index.html.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: site
          retention-days: 7

  # A release-notes page for a version that is not out yet carries an "in
  # preparation" banner in place of a release date, tagged with an `<!-- unreleased`
  # comment. That banner must never reach the published site: Pages publishes
  # from main, which is where a release lands, so a published page would deny a
  # version the header stamps as shipped. Blocking the pull request is the whole
  # point - the release date is known before the merge, so it can be set then,
  # and the run on main never has to fail after the fact.
  # Pull requests into develop are not checked - the banner belongs there.
  # No path filter: a PR into main must be checked whatever it touches.
  #
  # Run through `bash` rather than executed directly: this repo is developed on
  # Windows, where the executable bit is easily lost from the index.
  release-markers:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/check-release-markers.sh docs

  # main only: Pages serves one deployment per repository. The build runs here
  # with SITE_URL set to the real Pages address; deploy below publishes it.
  # Only main may publish: a manual run from another branch must do nothing.
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      # Catches a direct push that bypassed the release-markers job.
      - run: bash ci/check-release-markers.sh docs
      - run: mkdocs build --strict
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Needs Settings -> Pages -> Source: GitHub Actions (set once by the owner).
  # One deployment at a time; a running one is not cancelled halfway.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
